<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Vault — a one-room museum heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; object-fit: contain; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="The Night Vault: sneak the thief across the museum gallery, avoid the guards' and cameras' vision cones, lift the Sun Disk and escape through the service door"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
